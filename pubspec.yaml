name: ganesh_moulding_pati
description: A comprehensive Flutter CRM application for Ganesh Moulding Party management.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: 2.12.0
  provider: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.0.0
  flutter_dotenv: ^5.1.0
  dropdown_search: 5.0.6
  pdf: ^3.11.3
  printing: ^5.13.1
  path_provider: ^2.1.5
  blue_thermal_printer: ^1.2.3
  url_launcher: ^6.3.2
  signature: ^6.3.0
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sign_in_with_apple: 6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.jpg"
  android: true
  ios: true
  web: false
  android_12:
    image: "assets/images/logo.jpg"
    color: "#ffffff"


flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env
